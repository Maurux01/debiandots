# kitty.conf - terminal Catppuccin Mocha / mauve
# Fuentes instaladas por install.sh: JetBrainsMono Nerd Font + Symbols Nerd Font

font_family      JetBrainsMono Nerd Font, Symbols Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Catppuccin Mocha
foreground            #cdd6f4
background            #1e1e2e
cursor_color          #cba6f7
cursor_text_color     #1e1e2e
selection_foreground  #cdd6f4
selection_background  #313244

# Negro y blanco
color0  #11111b
color15 #cdd6f4

# Rojo, verde, amarillo, azul, magenta, cian, gris
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #cba6f7
color6  #94e2d5
color7  #bac2de

# Versiones brillantes
color8  #585b70
color9  #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #cba6f7
color14 #94e2d5

# UI
tab_bar_style         powerline
tab_powerline_style   slanted
tab_title_template    "{index}: {title}"
active_tab_foreground   #1e1e2e
active_tab_background   #cba6f7
inactive_tab_foreground #a6adc8
inactive_tab_background #313244

window_padding_width 8
opacity 0.96
hide_cursor_spots yes
mouse_hide_wait 3.0
enable_audio_bell no
scrollback_lines 10000
