[colors]
background = #282828
background-alt = #3c3836
foreground = #ebdbb2
accent = #fabd2f
alert = #fb4934
muted = #a89984

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 28pt
radius = 0
fixed-center = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt
border-size = 0pt

padding-left = 1
padding-right = 1

module-margin = 1

font-0 = "JetBrainsMono Nerd Font:size=10;2"
font-1 = "Font Awesome 6 Free Solid:size=10;2"

modules-left = xworkspaces
modules-center = xwindow
modules-right = cpu memory pulseaudio network battery date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true

[module/xworkspaces]
type = internal/xworkspaces
label-active = %name%
label-active-background = ${colors.accent}
label-active-foreground = ${colors.background}
label-active-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-urgent = %name%
label-urgent-background = ${colors.alert}
label-urgent-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.muted}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.accent}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = " "
format-prefix-foreground = ${colors.accent}
label = %percentage_used:2%%

[module/pulseaudio]
type = internal/pulseaudio
format-volume-prefix = " "
format-volume-prefix-foreground = ${colors.accent}
label-volume = %percentage%%
label-muted =  Muted
label-muted-foreground = ${colors.muted}

[module/network]
type = internal/network
interface = wlan0 # Change to 'eth0' if using ethernet
interval = 3
format-connected = <label-connected>
format-connected-prefix = " "
format-connected-prefix-foreground = ${colors.accent}
label-connected = %essid%
format-disconnected = <label-disconnected>
label-disconnected =  Disconnected
label-disconnected-foreground = ${colors.muted}

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
full-at = 98
format-charging = <animation-charging> <label-charging>
format-charging-prefix = " "
format-charging-prefix-foreground = ${colors.accent}
label-charging = %percentage%%
format-discharging = <ramp-capacity> <label-discharging>
label-discharging = %percentage%%
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
ramp-capacity-foreground = ${colors.accent}

[module/date]
type = internal/date
interval = 1
date = %H:%M
date-alt = %Y-%m-%d %H:%M:%S
format-prefix = " "
format-prefix-foreground = ${colors.accent}
label = %date%