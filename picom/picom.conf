backend = "glx";
vsync = true;
corner-radius = 12;
round-borders = 3;

# Shadows
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.3;
shadow-offset-x = -5;
shadow-offset-y = -5;

# Exclusions
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Polybar'",
  "class_g = 'Rofi'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Transparency for inactive windows
inactive-opacity = 0.95;
active-opacity = 1.0;
frame-opacity = 1.0;

# Blur (minimal premium)
blur-background = true;
blur-method = "dual_kawase";
blur-strength = 5;
blur-background-exclude = [
  "class_g = 'Polybar'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Fading (transiciones suaves)
fading = true;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-delta = 5;
fade-exclude = [
  "class_g = 'Rofi'"
];