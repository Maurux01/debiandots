backend = "glx";
vsync = true;
corner-radius = 12;
round-borders = 3;

# Shadows
shadow = true;
shadow-radius = 12;
shadow-opacity = 0.3;
shadow-offset-x = -5;
shadow-offset-y = -5;

# Exclusions
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Polybar'",
  "class_g = 'Rofi'",
  "_GTK_FRAME_EXTENTS@:c"
];

# Transparency for inactive windows
inactive-opacity = 0.95;
active-opacity = 1.0;
frame-opacity = 1.0;