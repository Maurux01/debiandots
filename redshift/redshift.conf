; redshift.conf - night light (noches calidas Catppuccin-friendly)
; Edit lat/lon for your city: https://latlong.net
; Toggle at runtime: pkill -USR1 redshift | Reset: redshift -x

[redshift]
temp-day=6500
temp-night=4500
transition=1
brightness=1.0
gamma=0.8
location-provider=manual
adjustment-method=randr

[manual]
lat=40.4
lon=-3.7
